<div
  id="app-container"
  class="flex mat-bg-surface mat-text-on-surface items-center justify-center flex-col"
>
  <mat-toolbar
    color="primary"
    class="sticky top-0 z-50 mb-4 w-screen flex items-center justify-between"
  >
    <span id="left-nav-section" class="flex items-center justify-start">
      <a
        mat-button
        class="mr-4 hover:bg-opacity-80"
        routerLink="/"
        routerLinkActive="text-orange-600"
        >{{ 'home' | capitalize }}</a
      >
      <a
        mat-button
        class="mr-4 hover:bg-opacity-80"
        routerLink="/about"
        routerLinkActive="text-orange-600"
        >{{ 'about' | capitalize }}</a
      >
    </span>
    <span id="right-nav-section" class="flex items-center justify-end">
      <a mat-icon-button class="mr-4" routerLink="/login">
        <mat-icon>login</mat-icon>
      </a>
      <a mat-icon-button class="mr-4" routerLink="/menu">
        <mat-icon>menu</mat-icon>
      </a>
    </span>
  </mat-toolbar>
  <router-outlet></router-outlet>
</div>
