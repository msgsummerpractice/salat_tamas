name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - 07302026-componentsdirectives
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - 07302026-componentsdirectives

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: angular-learning/package-lock.json

      - name: Install dependencies
        working-directory: ./angular-learning
        run: npm ci

      - name: Build Angular
        working-directory: ./angular-learning
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_WATER_027CD5803 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          skip_app_build: true

          app_location: "/angular-learning/src/"
          output_location: ""
          api_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_WATER_027CD5803 }}
          action: "close"
